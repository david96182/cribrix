name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check cribrix tests scripts
      - run: ruff format --check cribrix tests scripts
      - run: mypy cribrix

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # No services needed: the pipeline depends only on Protocols.
      - run: pytest tests/unit -q --cov=cribrix --cov-report=term-missing

  integration:
    name: Integration tests (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cribrix
          POSTGRES_PASSWORD: cribrix
          POSTGRES_DB: cribrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cribrix -d cribrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -q -m integration
        env:
          CRIBRIX_TEST_DATABASE_URL: postgresql+asyncpg://cribrix:cribrix@localhost:5432/cribrix

  evaluate:
    name: Evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Wiring check: the deterministic fakes. Says nothing about model quality.
      - run: python -m cribrix.evaluation.runner --backend fake
      # Quality gate: replays the committed recording of live Jev + LLM calls,
      # so the merge is gated on real model behaviour, offline and for free.
      # A prompt or pipeline change that alters any request is a recording
      # miss (exit 2) until `make eval-record` is re-run and committed.
      - run: python -m cribrix.evaluation.runner --backend replay --min-accuracy 75 --max-hallucination 10

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Proves the image builds for Apple Silicon, not just CI's amd64.
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
